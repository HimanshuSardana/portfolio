name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build site with kite
        run: |
          go install github.com/HimanshuSardana/kite@latest
          kite build

      - name: Sync output/ to VPS
        uses: burnett01/rsync-deployments@master
        with:
          switches: -avzr --delete
          path: output/
          remote_path: /srv/www/portfolio/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
