name: Deploy portfolio website

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "themes/**"
      - "static/**"
      - "config.yaml"
      - "og.typ"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Only one deploy at a time; a newer push wins.
concurrency:
  group: deploy-portfolio-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false # no Go module here, only `go install kite`

      # Open graph cards are rendered with Typst. Version pinned so the
      # generated PNGs stay identical between builds.
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      # og.typ asks for "Iosevka NF", which runners do not ship. The Nerd Fonts
      # release is ~92MB, so cache just the two weights the card needs.
      - name: Cache card font
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/og-fonts
          key: iosevka-nf-3.5.1

      - name: Install card font
        run: |
          set -euo pipefail
          font_dir="$RUNNER_TEMP/og-fonts"
          if [ -f "$font_dir/IosevkaNerdFont-Regular.ttf" ]; then
            echo "Iosevka NF already cached"
            exit 0
          fi
          mkdir -p "$font_dir"
          curl -fsSL -o "$RUNNER_TEMP/iosevka.tar.xz" \
            https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Iosevka.tar.xz
          tar -xJf "$RUNNER_TEMP/iosevka.tar.xz" -C "$font_dir" \
            IosevkaNerdFont-Regular.ttf IosevkaNerdFont-Bold.ttf
          rm -f "$RUNNER_TEMP/iosevka.tar.xz"

      # Pinned to the commit that adds Typst OG cards; move back to @latest
      # once a kite release contains it.
      - name: Install kite
        run: go install github.com/HimanshuSardana/kite@346f7018be88b01f2de47b7c5cd1ba8cd743e719

      - name: Build site
        env:
          TYPST_FONT_PATHS: ${{ runner.temp }}/og-fonts
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/kite" build

          posts=$(find content -name '*.md' | wc -l)
          cards=$(find output -name og.png | wc -l)
          if [ "$cards" -ne "$posts" ]; then
            echo "expected $posts og.png cards, found $cards" >&2
            exit 1
          fi
          echo "generated $cards open graph cards"

      - name: Configure SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          set -euo pipefail
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o IdentitiesOnly=yes" \
            output/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
